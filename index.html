<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#232323">
<title>Szómondó 1</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Szómondó 1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Permanent+Marker&family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #232323;
    --ink: #EDEAE4;
    --ink-soft: #A8A39A;
    --paprika: #E0692F;
    --paprika-deep: #C1440E;
    --teal: #3A8177;
    --gold: #D9A441;
    --green: #4CAF6D;
    --red: #E05C5C;
    --neutral-bg: #4A4A4A;
    --neutral-border: #666666;
    --card: #2E2E2E;
    --line: #444444;
    --line-strong: #5A5A5A;
    --radius: 18px;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; touch-action: manipulation; background: #232323; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }
  .app{
    width: 100%;
    max-width: 460px;
    height: 100%;
    padding: calc(14px + var(--top-offset, 0px)) 18px calc(20px + var(--bottom-offset, 0px));
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }

  .top-controls-grid{
    display: grid;
    grid-template-columns: auto auto auto;
    align-items: center;
    gap: 6px;
  }
  .menu-wrap{
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-start;
  }
  .menu-btn-small{
    width: 52px;
    height: 40px;
    padding: 0;
    font-size: 18px;
    justify-content: center;
  }
  .menu-panel{
    display: none;
    flex-direction: column;
    gap: 6px;
    position: absolute;
    top: 90px;
    left: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    z-index: 10;
    min-width: 200px;
  }
  .menu-panel.show{ display: flex; }
  .menu-panel button{
    background: none;
    border: none;
    text-align: left;
    padding: 14px 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  .menu-panel button:hover{ background: var(--bg); }
  .menu-section-label{
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 8px 10px;
    text-align: left;
  }
  .theme-area-list{
    display: none;
    flex-direction: column;
    gap: 2px;
  }
  .theme-area-list.show{ display: flex; }
  .theme-area-btn{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .theme-area-btn span{
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    padding: 2px 8px;
    border-radius: 8px;
    border: 1px solid var(--line);
  }
  .theme-area-btn.on span{
    color: var(--paprika-deep);
    border-color: var(--paprika);
    background: rgba(224,105,47,0.12);
  }
  .menu-sep{
    height: 1px;
    background: var(--line);
    margin: 4px 2px;
  }
  .menu-panel .lang-option{
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .menu-panel .lang-option span{ font-size: 20px; line-height: 1; }
  .menu-panel .lang-option.active{
    background: var(--paprika);
    color: #fff;
  }

  .profile-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--line);
    transition: border-color 0.2s ease;
  }
  .profile-item.active {
    border-color: var(--gold);
    background: rgba(217, 164, 65, 0.05);
  }
  .profile-color-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .profile-name {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .profile-item .icon-btn {
    padding: 4px 10px;
    font-size: 12px;
    height: 30px;
    flex-shrink: 0;
  }
  .profile-item .icon-btn.select-btn {
    background: var(--paprika);
    border-color: var(--paprika);
    color: #fff;
  }
  .profile-item .icon-btn.select-btn.active {
    background: var(--neutral-bg);
    border-color: var(--neutral-border);
    color: var(--ink-soft);
  }

  .mic-row{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mic-wrap{
    margin-left: auto;
    position: relative;
  }
  #micBtn{
    width: 88px;
    height: 88px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    touch-action: none;
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  #micBtn::before{
    content: "";
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px solid rgba(224,105,47,0.78);
    pointer-events: none;
    transition: border-color 0.2s ease;
  }
  #micBtn:active{ transform: scale(0.96); }
  #micQuestionBadge{
    position: absolute;
    top: -4px;
    right: -4px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--card);
    color: var(--ink);
    border: 1px solid rgba(224,105,47,0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    z-index: 2;
    transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
  }
  #micQuestionBadge:active{ transform: scale(0.92); }
  #micBtn.listening{
    animation: micGlow 1.4s ease-in-out infinite;
  }
  #micBtn.listening::before{
    box-shadow: 0 0 0 4px rgba(76,175,109,0.30),
                0 0 22px 8px rgba(76,175,109,0.45);
  }
  #micQuestionBadge.listening{
    box-shadow: 0 0 0 3px rgba(76,175,109,0.30),
                0 0 16px 6px rgba(76,175,109,0.5);
    animation: micGlow 1.4s ease-in-out infinite;
  }
  @keyframes micGlow{
    0%, 100%{ filter: brightness(1); }
    50%{ filter: brightness(1.18); }
  }
  #micBtn svg{ width: 34px; height: 34px; }

  .menu-wrap-full{ grid-column: 1 / -1; }
  .question-btn{
    width: 42px;
    height: 42px;
    border-radius: 11px;
    border: 2px solid var(--line);
    background: var(--card);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--ink-soft);
    opacity: 0.6;
  }
  .question-btn.active{
    border-color: var(--paprika);
    color: var(--paprika-deep);
    background: rgba(224,105,47,0.12);
    opacity: 1;
  }
  .question-btn.flash-red, .action-btn.flash-red, .icon-btn.flash-red{
    animation: flashRed 0.5s ease;
  }
  @keyframes flashRed{
    0%, 100% { background: var(--card); border-color: var(--line); }
    30% { background: rgba(193,59,59,0.35); border-color: var(--red); }
  }
  @keyframes flashGreen{
    0%, 100% { background: var(--card); border-color: var(--line); }
    30% { background: rgba(46,125,70,0.35); border-color: var(--green); }
  }
  .icon-btn.flash-incorrect{ animation: flashRed 0.6s ease; }
  .icon-btn.flash-correct{ animation: flashGreen 0.6s ease; }
  .practice-answer-row input.correct-bg{
    background: rgba(46,125,70,0.15);
    border-color: var(--green);
  }

  .error-status{
    font-size: 13px;
    color: var(--paprika-deep);
    text-align: center;
    display: none;
  }
  .error-status.show{ display: block; }

  .fallback-row{ display: flex; gap: 8px; }
  .fallback-row input{
    flex: 1;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    background: var(--card);
    color: var(--ink);
  }
  .fallback-row button{
    padding: 0 16px;
    border-radius: 12px;
    border: none;
    background: var(--teal);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .result-card{
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 18px 16px;
    border: 1px solid var(--line);
    display: none;
    flex-direction: column;
    gap: 10px;
    position: relative;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28);
  }
  .result-card.show{ display: flex; }
  .result-card::before{
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 13px;
    border: 1px solid rgba(224,105,47,0.6);
    pointer-events: none;
  }
  .lang-tag{
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 8px;
    border-radius: 20px;
    text-transform: uppercase;
    display: inline-block;
  }
  .lang-tag.hu{ background: rgba(217,164,65,0.2); color: var(--paprika-deep); }
  .lang-tag.fx{ background: rgba(31,76,70,0.12); color: var(--teal); }
  .orig-text{ font-size: 15px; color: var(--ink-soft); outline: none; border-radius: 8px; padding: 6px 8px; margin: -6px -8px; background: rgba(0,0,0,0.035); min-height: 1.4em; }

  .trans-text{
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.25;
    outline: none;
    border-radius: 8px;
    padding: 6px 8px;
    margin: -6px -8px;
    background: rgba(0,0,0,0.035);
    min-height: 1.3em;
  }
  .orig-text:focus, .trans-text:focus{ background: rgba(224,105,47,0.06); box-shadow: 0 0 0 1px rgba(224,105,47,0.3); }
  .result-main{
    display: flex;
    gap: 10px;
  }
  .result-text{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .result-actions{
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    margin-top: auto;
  }
  .action-btn{
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-btn:hover{ filter: brightness(0.93); }
  .action-btn.active{
    border-color: var(--paprika);
    color: var(--paprika-deep);
    background: rgba(224,105,47,0.12);
  }
  .action-btn.listening-active{ background: var(--neutral-bg); border-color: var(--neutral-border); color: var(--ink); }
  .icon-btn{
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display:flex; align-items:center; gap:6px;
  }
  .icon-btn:hover{ filter: brightness(0.93); }
  .icon-btn:disabled{ opacity: 0.45; cursor: default; }
  .icon-btn.listening-active{ background: var(--neutral-bg); border-color: var(--neutral-border); color: var(--ink); }
  .icon-btn.order-active{ background: var(--paprika); border-color: var(--paprika); color: #fff; }

  section.history{ display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
  .history-head{ display: flex; align-items: baseline; padding: 0 2px; }
  .history-head h2{ font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; margin: 0; }
  .history-head span{ font-size: 12px; color: var(--ink-soft); margin-left: auto; }
  .play-row{ display: flex; gap: 6px; align-items: center; }
  #allSelectBtn{ padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .play-row .icon-btn{ flex: 0 0 auto; justify-content: center; align-items: center; height: 38px; padding: 0 10px; font-size: 13px; }
  .play-row #flashcardBtn{ padding: 0 12px; }
  .play-row #flashcardBtn.active{ background: var(--paprika); border-color: var(--paprika); color: #fff; }
  .play-row #playFxBtn{ width: 64px; margin-left: auto; }
  .play-row #deleteModeBtn{ padding: 0 10px; }
  .play-row #addMemBtn{ padding: 0 10px; }
  .play-row #deleteModeBtn.active{ background: var(--red); border-color: var(--red); color: #fff; }
  .play-row #addMemBtn.active{ background: var(--teal); border-color: var(--teal); color: #fff; }
  .history-list-wrap{
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .history-scroll-edge{
    position: absolute;
    top: 0; left: -18px; right: -18px;
    height: 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0));
    opacity: 0;
    transition: opacity 0.15s ease;
    z-index: 3;
    pointer-events: none;
  }
  .history-scroll-edge.show{ opacity: 1; }
  .history-list{
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    align-content: start;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 2px;
    resize: none;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .history-list::-webkit-scrollbar{ width: 0; height: 0; }
  .group-divider{ grid-column: 1 / -1; border-top: 1px solid var(--line-strong); margin: 4px 0; }
  .hist-item{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    cursor: pointer;
    user-select: none;
    min-width: 0;
    text-align: center;
  }
  .hist-item:hover{ border-color: var(--paprika); }
  .hist-item.selected{ border-color: var(--paprika); background: rgba(224,105,47,0.07); }
  .hist-hu{ font-size: 10px; color: var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 100%; }
  .hist-fx{ font-size: 12px; font-weight: 600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 100%; }
  .empty-state{
    grid-column: 1 / -1;
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    padding: 18px 10px;
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  .memory-overlay{
    display: none;
    position: fixed;
    inset: -2px;
    background: var(--bg);
    z-index: 100;
  }
  .memory-overlay.show{ display: flex; justify-content: center; }
  .memory-panel{
    background: var(--bg);
    width: 100%;
    max-width: 460px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  .memory-sticky-top{ flex-shrink: 0; }
  .memory-header{
    display: flex;
    align-items: center;
    gap: 8px;
    padding: calc(14px + var(--top-offset, 0px)) 16px 8px;
  }
  .memory-lang-frame.find-on{
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25), 0 0 16px 4px rgba(255,255,255,0.35);
  }
  #practiceNextGroupBtn.flash-white{
    box-shadow: 0 0 0 3px rgba(255,255,255,0.25), 0 0 16px 4px rgba(255,255,255,0.35);
  }
  .find-hit{
    outline: 2px solid var(--paprika);
    outline-offset: -2px;
    background: rgba(224,105,47,0.18) !important;
  }
  #memoryTable tr.find-inline td{
    padding: 0;
    border-bottom: none;
    border-left: none;
  }
  .find-results{
    position: sticky;
    left: 0;
    width: calc(100vw - 40px);
    max-width: 440px;
    padding: 10px 4px 12px;
    border-top: 1px solid rgba(224,105,47,0.6);
    background: var(--bg);
  }
  .find-results.show{ display: block; }
  .find-head{
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }
  .find-head b{ color: var(--paprika); font-size: 14px; }
  .find-row{
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--line);
  }
  .find-num{
    flex: 0 0 26px;
    font-size: 12px;
    font-weight: 700;
    color: var(--paprika);
    font-variant-numeric: tabular-nums;
    padding-top: 3px;
  }
  .find-sentences{ flex: 1; min-width: 0; font-size: 13px; line-height: 1.35; }
  .find-sentences .fx{ color: var(--ink); }
  .find-sentences .hu{ color: var(--ink-soft); font-size: 12px; }
  .memory-lang-frame{
    width: 38px;
    height: 38px;
    border: 2px solid var(--paprika);
    border-radius: 10px;
    background: var(--bg);
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: var(--paprika-deep);
    flex-shrink: 0;
    padding: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .memory-header-btns{ margin-left: auto; }
  .memory-header h2{
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  .memory-header-btns{
    display: flex;
    gap: 5px;
  }
  .header-icon-btn{
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink-soft);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .header-icon-btn.active{
    background: var(--paprika);
    border-color: var(--paprika);
    color: #fff;
  }
  #memoryAllBtn{ width: auto; padding: 0 8px; font-weight: 700; }
  #memoryTable tr.selected td{
    background: rgba(224,105,47,0.1);
  }
  #memoryTable tr.block-end td{
    border-bottom: 1px solid rgba(224,105,47,0.78);
  }
  .memory-toolbar{
    display: flex;
    gap: 6px;
    padding: 0 16px 10px;
  }
  .memory-toolbar .mem-toolbar-btn{ flex: 1; justify-content: center; font-size: 11px; padding: 6px 4px; }
  #memoryNoteBtn{ flex-shrink: 0; }
  .memory-table-wrap{
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: auto;
    padding: 0 8px 16px;
  }
  #memoryTable{
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
    font-size: 13px;
  }
  #memoryTable th{
    text-align: left;
    font-size: 11px;
    color: var(--ink-soft);
    font-weight: 600;
    padding: 6px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  #memoryTable td{
    padding: 8px 6px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
    min-width: 110px;
  }
  #memoryTable td.memory-del-cell{
    min-width: 0;
    width: 38px;
    padding: 8px 4px;
    text-align: center;
  }
  #memoryTable td.memory-num-cell{
    min-width: 0;
    width: 30px;
    padding: 8px 2px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  #memoryTable td.memory-link-cell{
    min-width: 0;
    width: 40px;
    padding: 8px 4px;
    text-align: center;
  }
  .memory-link{
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink-soft);
    font-size: 12px;
    margin: 0 auto;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .memory-link.has-links{
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
    font-weight: 700;
  }
  #memoryTable td[contenteditable]{
    outline: none;
    word-break: break-word;
  }

<script>
(function(){
  // --- Profil Manager ---
  const PROFILES_STORAGE_KEY = 'hu-multi-profiles-v1';
  const DEFAULT_PROFILE_NAME = 'Profil 1';
  const PROFILE_COLORS = ['#E0692F', '#4A90E2', '#4CAF6D', '#A78BFA', '#FF8FAB'];
  const MAX_PROFILES = 5;

  let profilManager = {
    profiles: [],
    activeProfileName: DEFAULT_PROFILE_NAME,

    loadProfiles() {
      try {
        const raw = localStorage.getItem(PROFILES_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          this.profiles = parsed.profiles || [];
          this.activeProfileName = parsed.activeProfileName || DEFAULT_PROFILE_NAME;
        } else {
          this.profiles = [{ name: DEFAULT_PROFILE_NAME, color: PROFILE_COLORS[0] }];
          this.activeProfileName = DEFAULT_PROFILE_NAME;
          this.saveProfiles();
        }
        if (!this.profiles.find(p => p.name === this.activeProfileName)) {
          this.activeProfileName = this.profiles[0]?.name || DEFAULT_PROFILE_NAME;
        }
      } catch (e) {
        this.profiles = [{ name: DEFAULT_PROFILE_NAME, color: PROFILE_COLORS[0] }];
        this.activeProfileName = DEFAULT_PROFILE_NAME;
      }
    },

    saveProfiles() {
      try {
        localStorage.setItem(PROFILES_STORAGE_KEY, JSON.stringify({
          profiles: this.profiles,
          activeProfileName: this.activeProfileName
        }));
      } catch (e) {
        console.error('Failed to save profiles', e);
        showError('Nem sikerült menteni a profilokat.');
      }
    },

    getDataKey(baseKey) {
      return `${baseKey}_${this.activeProfileName}`;
    },

    setActiveProfile(profileName) {
      if (this.activeProfileName === profileName) return;
      if (this.profiles.find(p => p.name === profileName)) {
        this.activeProfileName = profileName;
        this.saveProfiles();
        this.loadDataForActiveProfile();
      }
    },

    loadDataForActiveProfile() {
      loadDictionary();
      loadMemory();
      renderHistory();
      renderMemoryTable();
      updatePlayButtonLabels();
      renderProfileList();
    },

    addProfile(name) {
      if (this.profiles.length >= MAX_PROFILES) {
        showError('Maximum 5 profilt hozhatsz létre.');
        return false;
      }
      const usedColors = this.profiles.map(p => p.color);
      const availableColor = PROFILE_COLORS.find(c => !usedColors.includes(c));
      if (!availableColor) {
        showError('Nincs több szín elérhető.');
        return false;
      }
      if (this.profiles.find(p => p.name === name)) {
        showError('Már létezik ilyen nevű profil.');
        return false;
      }
      this.profiles.push({ name, color: availableColor });
      this.saveProfiles();
      renderProfileList();
      return true;
    },

    renameProfile(oldName, newName) {
      if (oldName === newName) return true;
      if (this.profiles.find(p => p.name === newName)) {
        showError('Már létezik ilyen nevű profil.');
        return false;
      }
      const profile = this.profiles.find(p => p.name === oldName);
      if (!profile) return false;
      profile.name = newName;
      if (this.activeProfileName === oldName) {
        this.activeProfileName = newName;
      }
      this.saveProfiles();
      renderProfileList();
      return true;
    },

    deleteProfile(profileName) {
      if (this.profiles.length <= 1) {
        showError('Nem törölheted az utolsó profilt.');
        return;
      }
      if (profileName === DEFAULT_PROFILE_NAME) {
        showError('Az alapértelmezett profilt nem törölheted.');
        return;
      }
      this.profiles = this.profiles.filter(p => p.name !== profileName);
      if (this.activeProfileName === profileName) {
        this.activeProfileName = this.profiles[0]?.name || DEFAULT_PROFILE_NAME;
      }
      this.saveProfiles();
      this.loadDataForActiveProfile();
      renderProfileList();
    }
  };

  // --- Profil UI ---
  const profilOverlay = document.getElementById('profilOverlay');
  const profileListContainer = document.getElementById('profileListContainer');
  const addProfileBtn = document.getElementById('addProfileBtn');
  const closeProfileBtn = document.getElementById('closeProfileBtn');

  function renderProfileList() {
    if (!profileListContainer) return;
    profileListContainer.innerHTML = '';
    const profiles = profilManager.profiles;
    if (!profiles.length) {
      profileListContainer.innerHTML = '<div style="text-align:center;color:var(--ink-soft);padding:20px 0;">Nincs elérhető profil.</div>';
      return;
    }
    profiles.forEach((profile, index) => {
      const isActive = profile.name === profilManager.activeProfileName;
      const item = document.createElement('div');
      item.className = `profile-item ${isActive ? 'active' : ''}`;

      const dot = document.createElement('span');
      dot.className = 'profile-color-dot';
      dot.style.backgroundColor = profile.color;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'profile-name';
      nameSpan.textContent = profile.name;

      const selectBtn = document.createElement('button');
      selectBtn.className = `icon-btn select-btn ${isActive ? 'active' : ''}`;
      selectBtn.textContent = isActive ? 'Aktív' : 'Kiválaszt';
      selectBtn.addEventListener('click', () => {
        if (!isActive) {
          profilManager.setActiveProfile(profile.name);
        }
      });

      const renameBtn = document.createElement('button');
      renameBtn.className = 'icon-btn';
      renameBtn.textContent = '✏️';
      renameBtn.style.padding = '4px 8px';
      renameBtn.style.fontSize = '14px';
      renameBtn.addEventListener('click', () => {
        const newName = prompt(`Add meg a profil új nevét (jelenleg: "${profile.name}"):`, profile.name);
        if (newName && newName.trim() && newName.trim() !== profile.name) {
          profilManager.renameProfile(profile.name, newName.trim());
        }
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'icon-btn';
      deleteBtn.textContent = '🗑️';
      deleteBtn.style.padding = '4px 8px';
      deleteBtn.style.fontSize = '14px';
      deleteBtn.style.color = 'var(--red)';
      if (profile.name === DEFAULT_PROFILE_NAME || profilManager.profiles.length <= 1) {
        deleteBtn.style.opacity = '0.3';
        deleteBtn.style.pointerEvents = 'none';
      }
      deleteBtn.addEventListener('click', () => {
        if (confirm(`Biztosan törölni szeretnéd a "${profile.name}" profilt?`)) {
          profilManager.deleteProfile(profile.name);
        }
      });

      item.appendChild(dot);
      item.appendChild(nameSpan);
      const btnGroup = document.createElement('div');
      btnGroup.style.display = 'flex';
      btnGroup.style.gap = '4px';
      btnGroup.appendChild(selectBtn);
      btnGroup.appendChild(renameBtn);
      btnGroup.appendChild(deleteBtn);
      item.appendChild(btnGroup);

      profileListContainer.appendChild(item);
    });
  }

  // --- Profil Overlay eseménykezelők ---
  function openProfileOverlay() {
    renderProfileList();
    profilOverlay.classList.add('show');
  }

  function closeProfileOverlay() {
    profilOverlay.classList.remove('show');
  }

  addProfileBtn.addEventListener('click', () => {
    const name = prompt('Add meg az új profil nevét:');
    if (name && name.trim()) {
      if (profilManager.addProfile(name.trim())) {
        const newProfile = profilManager.profiles.find(p => p.name === name.trim());
        if (newProfile) {
          profilManager.setActiveProfile(newProfile.name);
        }
      }
    }
  });

  closeProfileBtn.addEventListener('click', closeProfileOverlay);
  profilOverlay.addEventListener('click', (e) => {
    if (e.target === profilOverlay) closeProfileOverlay();
  });

  // --- Menü elem hozzáadása a profilokhoz ---
  const profileMenuItem = document.getElementById('profileMenuItem');
  if (profileMenuItem) {
    profileMenuItem.addEventListener('click', () => {
      menuPanel.classList.remove('show');
      openProfileOverlay();
    });
  }

  // --- A meglévő változók és függvények ---
  const micBtn = document.getElementById('micBtn');
  const micQuestionBadge = document.getElementById('micQuestionBadge');
  const menuBtn = document.getElementById('menuBtn');
  const menuPanel = document.getElementById('menuPanel');
  const errorStatus = document.getElementById('errorStatus');
  const fallbackRow = document.getElementById('fallbackRow');
  const textInput = document.getElementById('textInput');
  const textGo = document.getElementById('textGo');
  const resultCard = document.getElementById('resultCard');
  const origText = document.getElementById('origText');
  const transText = document.getElementById('transText');
  const memoryOpenBtn = document.getElementById('memoryOpenBtn');
  const memoryOverlay = document.getElementById('memoryOverlay');
  const memoryCloseBtn = document.getElementById('memoryCloseBtn');
  const memoryTrashBtn = document.getElementById('memoryTrashBtn');
  const memoryAddRowBtn = document.getElementById('memoryAddRowBtn');
  const memoryDelHead = document.getElementById('memoryDelHead');
  const linkOverlay = document.getElementById('linkOverlay');
  const linkInput = document.getElementById('linkInput');
  const linkOkBtn = document.getElementById('linkOkBtn');
  const linkCancelBtn = document.getElementById('linkCancelBtn');
  const memoryAllBtn = document.getElementById('memoryAllBtn');
  const memoryAddBtn = document.getElementById('memoryAddBtn');
  const memoryLangTag = document.getElementById('memoryLangTag');
  const memoryColHead = document.getElementById('memoryColHead');
  const memoryColHeadSentence = document.getElementById('memoryColHeadSentence');
  const memoryImportBtn = document.getElementById('memoryImportBtn');
  const memoryExportBtn = document.getElementById('memoryExportBtn');
  const memoryTableBody = document.getElementById('memoryTableBody');
  const memoryEmptyState = document.getElementById('memoryEmptyState');

  const exampleBtn = document.getElementById('exampleBtn');
  const visualEffectBtn = document.getElementById('visualEffectBtn');
  const visualEffectOverlay = document.getElementById('visualEffectOverlay');
  const visualEffectCloseBtn = document.getElementById('visualEffectCloseBtn');
  const visualEffectExampleBtn = document.getElementById('visualEffectExampleBtn');
  const visualEffectHuBtn = document.getElementById('visualEffectHuBtn');
  const veHuReveal = document.getElementById('veHuReveal');
  const visualEffectWord = document.getElementById('visualEffectWord');
  const visualEffectBgLayer = document.getElementById('visualEffectBgLayer');

  const practiceBtn = document.getElementById('practiceBtn');
  const translateBtn = document.getElementById('translateBtn');
  const practiceOverlay = document.getElementById('practiceOverlay');
  const practiceCloseBtn = document.getElementById('practiceCloseBtn');
  const practiceDrillView = document.getElementById('practiceDrillView');
  const practiceDirectionBtn = document.getElementById('practiceDirectionBtn');
  const practiceProgress = document.getElementById('practiceProgress');
  const practicePrompt = document.getElementById('practicePrompt');
  const practiceInput = document.getElementById('practiceInput');
  const practiceMicBtn = document.getElementById('practiceMicBtn');
  const practiceFeedback = document.getElementById('practiceFeedback');
  const practiceNextGroupBtn = document.getElementById('practiceNextGroupBtn');
  const practiceCheckBtn = document.getElementById('practiceCheckBtn');
  const practiceNextWordBtn = document.getElementById('practiceNextWordBtn');
  const tag1 = document.getElementById('tag1');
  const tag2 = document.getElementById('tag2');
  const speakBtn = document.getElementById('speakBtn');
  const saveBtn = document.getElementById('saveBtn');
  const historyList = document.getElementById('historyList');
  const historyScrollEdge = document.getElementById('historyScrollEdge');
  historyList.addEventListener('scroll', () => {
    historyScrollEdge.classList.toggle('show', historyList.scrollTop > 2);
  });
  const dictCount = document.getElementById('dictCount');
  const playFxBtn = document.getElementById('playFxBtn');
  const flashcardBtn = document.getElementById('flashcardBtn');
  const flashcardOverlay = document.getElementById('flashcardOverlay');
  const flashcard = document.getElementById('flashcard');
  const flashcardText = document.getElementById('flashcardText');
  const fcMuteBtn = document.getElementById('fcMuteBtn');
  const flashcardHint = document.getElementById('flashcardHint');
  const deleteModeBtn = document.getElementById('deleteModeBtn');
  const allSelectBtn = document.getElementById('allSelectBtn');
  const addMemBtn = document.getElementById('addMemBtn');
  const memoryJumpTopBtn = document.getElementById('memoryJumpTopBtn');
  const memoryJumpBottomBtn = document.getElementById('memoryJumpBottomBtn');
  const memoryTableWrap = document.getElementById('memoryTableWrap');

  const LANGS = {
    en: { label: 'Angol', tag: 'EN', tts: 'en-US', flag: '🇺🇸' },
    es: { label: 'Spanyol', tag: 'ES', tts: 'es-ES', flag: '🇪🇸' },
    de: { label: 'Német', tag: 'DE', tts: 'de-DE', flag: '🇩🇪' }
  };
  let selectedLang = 'en';

  let entries = [];
  let selectedIndex = 0;
  let pendingEntry = null;
  let pendingSourceId = null;
  let lastTarget = null;
  let currentForeignText = null;
  let currentForeignLang = 'en';
  let currentSourceIsHu = true;
  let exampleModeActive = false;
  let savedOrigText = '';
  let savedTransText = '';
  let exampleFxSentence = '';
  let exampleFxLang = 'en-US';
  let exampleIndex = 0;
  let exampleTotal = 0;
  let activeExampleEntry = null;
  let playingMode = null;
  let stopPlayback = false;
  let deleteMode = false;
  let deleteSelectedIds = new Set();
  let addMemMode = false;
  let addMemSelectedIds = new Set();
  let memoryEntries = [];

  function norm(s){ return String(s == null ? '' : s).trim().toLowerCase().replace(/[.,!?;:¿¡]+$/,'').replace(/^[¿¡]+/,''); }
  function makeId(){ return 'e' + Date.now() + Math.random().toString(36).slice(2,7); }

  function loadMemory(){
    try{
      const key = profilManager.getDataKey('hu-multi-memory-v1');
      const raw = localStorage.getItem(key);
      const parsed = raw ? JSON.parse(raw) : [];
      memoryEntries = Array.isArray(parsed) ? parsed : [];
    }catch(e){ memoryEntries = []; }
  }
  function saveMemoryToDisk(){
    try{
      const key = profilManager.getDataKey('hu-multi-memory-v1');
      localStorage.setItem(key, JSON.stringify(memoryEntries));
    }catch(e){
      showError('Nem sikerült menteni — lehet, hogy betelt a tárhely.');
    }
  }
  function findInMemory(text){
    const n = norm(text);
    return memoryEntries.find(e => e.lang === selectedLang && (norm(huOf(e)) === n || norm(fxOf(e)) === n));
  }

  function loadDictionary(){
    try{
      const key = profilManager.getDataKey('hu-multi-dictionary-v1');
      const raw = localStorage.getItem(key);
      if(raw){
        const parsed = JSON.parse(raw);
        entries = Array.isArray(parsed) ? parsed : [];
      } else {
        const oldKey = 'hu-multi-dictionary-v1';
        const oldRaw = localStorage.getItem(oldKey);
        if(oldRaw){
          const parsed = JSON.parse(oldRaw);
          const list = Array.isArray(parsed) ? parsed : Object.values(parsed);
          entries = list.map(v => ({ id: makeId(), hu: v.hu, foreign: v.en, lang: 'en', updatedAt: v.updatedAt || Date.now() }));
          saveDictionaryToDisk();
        } else {
          entries = [];
        }
      }
    }catch(e){ entries = []; }
    renderHistory();
  }
  function saveDictionaryToDisk(){
    try{
      const key = profilManager.getDataKey('hu-multi-dictionary-v1');
      localStorage.setItem(key, JSON.stringify(entries));
    }catch(e){
      showError('Nem sikerült menteni — lehet, hogy betelt a tárhely.');
    }
  }

  function huOf(e){ return e.swapped ? e.foreign : e.hu; }
  function fxOf(e){ return e.swapped ? e.hu : e.foreign; }
  function setHu(e, value){ if(e.swapped){ e.foreign = value; } else { e.hu = value; } }
  function setFx(e, value){ if(e.swapped){ e.hu = value; } else { e.foreign = value; } }

  function getVisibleEntries(){
    return entries.filter(e => e.lang === selectedLang);
  }
  function findEntry(text){
    const n = norm(text);
    return entries.find(e => e.lang === selectedLang && (norm(huOf(e)) === n || norm(fxOf(e)) === n));
  }
  function escapeHtml(s){
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
  }
  function getPlaybackEntries(){
    const visible = getVisibleEntries();
    return visible.slice(selectedIndex, selectedIndex + 5);
  }

  function updatePlayButtonLabels(){
    const tag = LANGS[selectedLang].tag;
    if(playingMode !== 'fx') playFxBtn.textContent = '▶ ' + tag;
    memoryLangTag.textContent = tag;
    memoryColHead.textContent = tag + ' szó';
    memoryColHeadSentence.textContent = tag + ' mondat';
  }

  let memorySelectMode = false;
  let memoryTrashMode = false;
  let findMode = false;
  let findTerm = '';
  let noteInsertMode = false;

  function sentenceHasWord(sentence, word){
    if(!sentence || !word) return false;
    const parts = String(sentence).toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
    return parts.includes(String(word).toLowerCase());
  }

  function buildFindResults(){
    const findResults = document.createElement('div');
    findResults.className = 'find-results';
    const visible = getVisibleMemoryEntries();
    const hits = visible
      .map((entry, index) => ({ entry, index }))
      .filter(({ entry }) => sentenceHasWord(entry.fxSentence, findTerm) ||
                             sentenceHasWord(entry.huSentence, findTerm));

    const head = document.createElement('div');
    head.className = 'find-head';
    head.innerHTML = '<b>' + escapeHtml(findTerm) + '</b> — ' + hits.length +
      ' mondatban' + (hits.length ? ' (sorszámok: ' + hits.map(h => h.index + 1).join(', ') + ')' : '');
    findResults.appendChild(head);

    hits.forEach(({ entry, index }) => {
      const row = document.createElement('div');
      row.className = 'find-row';

      const num = document.createElement('div');
      num.className = 'find-num';
      num.textContent = (index + 1) + '.';

      const txt = document.createElement('div');
      txt.className = 'find-sentences';
      txt.innerHTML = '<div class="fx">' + escapeHtml(entry.fxSentence || '') + '</div>' +
                      '<div class="hu">' + escapeHtml(entry.huSentence || '') + '</div>';

      const linkBtn = document.createElement('button');
      linkBtn.className = 'memory-link';
      const cnt = (entry.linkedWordIds || []).length;
      linkBtn.textContent = cnt ? String(cnt) : '🔗';
      if(cnt) linkBtn.classList.add('has-links');
      linkBtn.addEventListener('click', async (ev) => {
        ev.stopPropagation();
        const currentNums = (entry.linkedWordIds || [])
          .map(id => visible.findIndex(v => v.id === id))
          .filter(i => i >= 0).map(i => i + 1);
        const answer = await askForLinks(currentNums.join(', '));
        if(answer === null) return;
        const ids = [];
        answer.split(/[,\s]+/).filter(Boolean).forEach(part => {
          const n = parseInt(part, 10);
          const target = (!isNaN(n) && n >= 1 && n <= visible.length) ? visible[n - 1] : null;
          if(target && target.id !== entry.id && !ids.includes(target.id)) ids.push(target.id);
        });
        entry.linkedWordIds = ids;
        entry.updatedAt = Date.now();
        saveMemoryToDisk();
        renderMemoryTable();
      });

      row.appendChild(num);
      row.appendChild(txt);
      row.appendChild(linkBtn);

    });

  async function processMemoryImportFile(file){
    const text = await readCsvText(file);
    const lines = text.split(/\r?\n/).filter(l => l.trim().length);
    const delim = detectDelimiter(lines);
    let startIdx = 0;
    if(lines.length && /^magyar\s*[;,]/i.test(lines[0])) startIdx = 1;
    const pendingLinks = [];
    for(let i = startIdx; i < lines.length; i++){
      const row = parseCsvLine(lines[i], delim);
      if(row.length < 2) continue;
      const hu = (row[0] || '').trim();
      const foreign = (row[1] || '').trim();
      const huSentence = (row[2] || '').trim();
      const fxSentence = (row[3] || '').trim();
      const linkNums = (row[4] || '').trim();
      if(!hu && !foreign && !huSentence && !fxSentence) continue;
      let existing = null;
      if(hu){
        existing = memoryEntries.find(e => e.lang === selectedLang && norm(e.hu) === norm(hu));
      } else if(foreign){
        existing = memoryEntries.find(e => e.lang === selectedLang && norm(e.foreign) === norm(foreign));
      } else if(fxSentence){
        existing = memoryEntries.find(e => e.lang === selectedLang && norm(e.fxSentence) === norm(fxSentence));
      } else if(huSentence){
        existing = memoryEntries.find(e => e.lang === selectedLang && norm(e.huSentence) === norm(huSentence));
      }
      let target;
      if(existing){
        existing.hu = hu || existing.hu;
        existing.foreign = foreign || existing.foreign;
        existing.huSentence = huSentence || existing.huSentence;
        existing.fxSentence = fxSentence || existing.fxSentence;
        existing.updatedAt = Date.now();
        target = existing;
      } else {
        target = { id: makeId(), hu, foreign, huSentence, fxSentence, lang: selectedLang, updatedAt: Date.now() };
        memoryEntries.push(target);
      }
      if(linkNums) pendingLinks.push({ target, nums: linkNums });
    }
    if(pendingLinks.length){
      const langRows = memoryEntries.filter(e => e.lang === selectedLang);
      pendingLinks.forEach(({ target, nums }) => {
        const ids = [];
        nums.split(/[,\s]+/).filter(Boolean).forEach(part => {
          const n = parseInt(part, 10);
          const ref = (!isNaN(n) && n >= 1 && n <= langRows.length) ? langRows[n - 1] : null;
          if(ref && ref.id !== target.id && !ids.includes(ref.id)) ids.push(ref.id);
        });
        if(ids.length) target.linkedWordIds = ids;
      });
    }
    saveMemoryToDisk();
    renderMemoryTable();
  }

  // --- export / import ---
  function csvEscape(s, delim){
    const specials = new RegExp('["' + delim + '\\n]');
    if(specials.test(s)) return '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function parseCsvLine(line, delim){
    const result = [];
    let cur = ''; let inQuotes = false;
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(inQuotes){
        if(c === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else inQuotes = false; }
        else cur += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === delim){ result.push(cur); cur = ''; }
        else cur += c;
      }
    }
    result.push(cur);
    return result;
  }
  function detectDelimiter(lines){
    const sample = lines.slice(0, 5).join('\n');
    const semi = (sample.match(/;/g) || []).length;
    const comma = (sample.match(/,/g) || []).length;
    return semi >= comma ? ';' : ',';
  }

  function pickCsvFile(onFile){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv,text/csv';
    input.style.position = 'fixed';
    input.style.top = '-1000px';
    input.style.opacity = '0';
    document.body.appendChild(input);
    let handled = false;
    input.addEventListener('change', () => {
      handled = true;
      const file = input.files && input.files[0];
      if(file) onFile(file);
      if(input.parentNode) input.parentNode.removeChild(input);
    });
    window.addEventListener('focus', function cleanup(){
      window.removeEventListener('focus', cleanup);
      setTimeout(() => {
        if(!handled && input.parentNode) input.parentNode.removeChild(input);
      }, 1000);
    }, { once: true });
    input.click();
  }

  async function readCsvText(file){
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let text = '';
    try{
      if(bytes[0] === 0xFF && bytes[1] === 0xFE){
        text = new TextDecoder('utf-16le').decode(bytes);
      } else if(bytes[0] === 0xFE && bytes[1] === 0xFF){
        text = new TextDecoder('utf-16be').decode(bytes);
      } else {
        text = new TextDecoder('utf-8').decode(bytes);
      }
    }catch(e){ text = ''; }
    return text.replace(/^\uFEFF/, '');
  }

  function stripParens(text){
    return String(text || '')
      .replace(/\([^)]*\)/g, ' ')
      .replace(/\s{2,}/g, ' ')
      .trim();
  }
  function speak(text, lang){
    const clean = stripParens(text);
    if(!clean) return;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = lang; u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function speakAsync(text, lang){
    const clean = stripParens(text);
    if(!clean) return Promise.resolve();
    return new Promise((resolve) => {
      let done = false;
      const finish = () => { if(done) return; done = true; clearTimeout(guard); resolve(); };
      const guard = setTimeout(finish, Math.max(5000, clean.length * 150));
      try{
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(clean);
        u.lang = lang; u.rate = 0.95;
        u.onend = finish; u.onerror = finish;
        window.speechSynthesis.speak(u);
      }catch(e){ finish(); }
    });
  }

  function findExamplesInMemory(word, lang){
    if(!word) return [];
    const n = norm(word);
    if(!n) return [];
    const wordEntry = memoryEntries.find(e =>
      e.lang === lang && (norm(e.hu) === n || norm(e.foreign) === n));
    const results = [];
    memoryEntries.forEach(e => {
      if(e.lang !== lang) return;
      if(!isMemorySentenceEntry(e)) return;
      const sameRow = norm(e.hu) === n || norm(e.foreign) === n;
      const linked = wordEntry && (e.linkedWordIds || []).includes(wordEntry.id);
      if(sameRow || linked) results.push(e);
    });
    return results;
  }
  function findExampleInMemory(word, lang){
    return findExamplesInMemory(word, lang)[0] || null;
  }

  function applyExampleToCard(idx){
    const hits = findExamplesInMemory(currentForeignText, currentForeignLang);
    if(!hits.length) return null;
    const i = ((idx || 0) % hits.length + hits.length) % hits.length;
    const hit = hits[i];
    activeExampleEntry = hit;
    const langInfo = LANGS[currentForeignLang] || LANGS.en;
    const fxSentence = hit.fxSentence;
    const huSentence = hit.huSentence;
    if(!exampleModeActive){
      savedOrigText = origText.textContent;
      savedTransText = transText.textContent;
    }
    const counter = hits.length > 1 ? ' (' + (i + 1) + '/' + hits.length + ')' : '';
    if(tag1.textContent === 'HU'){
      origText.textContent = huSentence + counter;
      transText.textContent = fxSentence;
    } else {
      origText.textContent = fxSentence;
      transText.textContent = huSentence + counter;
    }
    exampleFxSentence = fxSentence;
    exampleFxLang = langInfo.tts;
    exampleTotal = hits.length;
    return { text: fxSentence, lang: langInfo.tts };
  }

  function renderVisualEffect(){

    let letterIndex = 0;
    const words = casedWord.split(' ');
    const wordUnits = [];
    words.forEach((word, wi) => {
      const unit = document.createElement('span');
      unit.className = 've-word-unit';
      Array.from(word).forEach((ch) => {
        const span = document.createElement('span');

        span.style.animationDelay = (letterIndex * 0.06) + 's';

        letterIndex++;
        unit.appendChild(span);
      });
      visualEffectWord.appendChild(unit);

    if(!fcAxis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      fcAxis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';

  function fcSlideTo(dir){

  function fcEndDrag(e){

    if(fcAxis === 'x' && Math.abs(dx) > 60){

    } else if(fcAxis === 'y' && Math.abs(dy) > 60){

      const rect = flashcard.getBoundingClientRect();
      const edge = rect.width * 0.15;

    if(fcFlipping) return;

    try{ window.speechSynthesis.cancel(); }catch(e){}

    const inner = flashcard.querySelector('.flashcard-inner');
    const DURATION = 400;
    const start = performance.now();
    let swapped = false;
    flashcard.style.transition = 'none';

    function frame(now){
      const t = Math.min(1, (now - start) / DURATION);
      const eased = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
      flashcard.style.transform = 'rotateY(' + (dir * 180 * eased) + 'deg)';

      if(!swapped && eased >= 0.5){
        swapped = true;
        fcShowingHu = !fcShowingHu;
        inner.style.transform = 'rotateY(180deg)';
        renderFlashcard(true);
      }

      if(t < 1){
        requestAnimationFrame(frame);
      } else {
        flashcard.style.transform = '';
        inner.style.transform = '';
        fcFlipping = false;
      }
    }
    requestAnimationFrame(frame);
  }

  const ES_WORDS = new Set(['el','la','los','las','y','o','pero','que','no','si','yo','tu','el','ella','nosotros','ellos','es','son','fue','sera','puede','bueno','malo','grande','pequeno','amor','hola','gracias','donde','cuando','como','cuanto','quien','muy','solo','todavia','aqui','alli']);

  function detectLanguage(text, targetCode){
    const lower = text.toLowerCase();
    if(/[őű]/.test(lower)) return 'hu';
    if(targetCode === 'de' && /[äß]/.test(lower)) return 'de';
    if(targetCode === 'es' && /[ñ¿¡]/.test(lower)) return 'es';
    if(targetCode === 'en' && /[áéíóöúü]/.test(lower)) return 'hu';
    const words = lower.split(/\s+/).map(w => w.replace(/[^a-zäöüßñáéíóú]/gi,''));
    const targetSet = targetCode === 'en' ? EN_WORDS : targetCode === 'es' ? ES_WORDS : DE_WORDS;
    let huScore = 0, targetScore = 0;
    words.forEach(w => { if(HU_WORDS.has(w)) huScore++; if(targetSet.has(w)) targetScore++; });
    return targetScore > huScore ? targetCode : 'hu';
  }

  async function translateGoogle(text, from, to){
    const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + from + "&tl=" + to + "&dt=t&q=" + encodeURIComponent(text);
    const response = await fetch(url);
    if(!response.ok) throw new Error('google failed');
    const data = await response.json();
    const segments = data && data[0];
    if(!Array.isArray(segments)) throw new Error('no result');
    let result = '';
    segments.forEach(seg => { if(seg && seg[0]) result += seg[0]; });
    result = result.trim();
    if(!result) throw new Error('no result');
    return result;
  }

  async function translateMyMemory(text, langpair){
    const url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) + "&langpair=" + langpair;
    const response = await fetch(url);
    const data = await response.json();
    const translated = data && data.responseData && data.responseData.translatedText;
    if(!translated) throw new Error('no result');
    return translated.trim();
  }

  async function translateLingva(text, from, to){
    const url = 'https://lingva.ml/api/v1/' + from + '/' + to + '/' + encodeURIComponent(text);
    const r = await fetch(url);
    if(!r.ok) throw new Error('lingva failed');
    const data = await r.json();
    const out = data && data.translation;
    if(!out) throw new Error('no result');
    return out.trim();
  }

  async function handleUtterance(said, isQuestion){
    said = said.trim();
    if(!said) return;
    if(isQuestion && !/[?？]\s*$/.test(said)){
      said = said + '?';
    }
    clearError();
    if(!isQuestion){
      const existing = findEntry(said);
      if(existing){
        const hu = huOf(existing);
        const foreign = fxOf(existing);
        const isHu = norm(hu) === norm(said);
        await showResult(hu, foreign, isHu ? true : false, existing.lang, existing.id);
        return;
      }
      const memHit = findInMemory(said);
      if(memHit){
        const hu = huOf(memHit);
        const foreign = fxOf(memHit);
        const isHu = norm(hu) === norm(said);
        await showResult(hu, foreign, isHu ? true : false, memHit.lang, null);
        return;
      }
    }
    const lang = detectLanguage(said, selectedLang);
    try{
      if(lang === 'hu'){
        const foreign = await translate(said, 'hu|' + selectedLang);
        await showResult(said, foreign, true, selectedLang, null);
      } else {
        const hu = await translate(said, selectedLang + '|hu');
        await showResult(hu, said, false, selectedLang, null);
      }
    }catch(e){
      showError('Hiba történt a fordítás közben.');
    }
  }

    practiceGroupLength = group.length;
    const entry = group[practiceWordIndex % group.length];
    const promptText = practiceDirection === 'hu' ? huOf(entry) : fxOf(entry);
    practiceCurrentCorrect = practiceDirection === 'hu' ? fxOf(entry) : huOf(entry);
    practiceCurrentLang = entry.lang;
    practiceProgress.textContent = (practiceGroupIndex + 1) + '. csoport (' + totalGroups + ' közül) — ' + ((practiceWordIndex % group.length) + 1) + '/' + group.length;
    practicePrompt.textContent = promptText;
    practiceInput.value = '';
    practiceFeedback.textContent = '';
    practiceFeedback.className = 'practice-feedback';
    practiceCheckBtn.classList.remove('flash-correct','flash-incorrect');
    practiceInput.classList.remove('correct-bg');
    if(document.activeElement !== practiceInput) practiceInput.focus();
  }

  function checkPracticeAnswer(){
    const answer = practiceInput.value;
    if(!answer || !answer.trim()) return;
    const correct = norm(answer) === norm(practiceCurrentCorrect);
    practiceCheckBtn.classList.remove('flash-correct','flash-incorrect');
    void practiceCheckBtn.offsetWidth;
    if(correct){
      practiceFeedback.textContent = '✔ Helyes!';
      practiceFeedback.className = 'practice-feedback correct';
      practiceCheckBtn.classList.add('flash-correct');
      practiceInput.classList.add('correct-bg');
      const langInfo = LANGS[practiceCurrentLang] || LANGS.en;
      const answerLang = practiceDirection === 'hu' ? langInfo.tts : 'hu-HU';
      speak(practiceCurrentCorrect, answerLang);
    } else {
      practiceFeedback.textContent = '✘ Helyesen: ' + practiceCurrentCorrect;
      practiceFeedback.className = 'practice-feedback incorrect';
      practiceCheckBtn.classList.add('flash-incorrect');
      practiceInput.classList.remove('correct-bg');
    }
  }

  function goToNextPracticeWord(){
    practiceWordIndex = (practiceWordIndex + 1) % (practiceGroupLength || 1);
    renderPracticeWord();
  }

  practicePrompt.addEventListener('click', () => {
    if(!practiceCurrentCorrect) return;
    const langInfo = LANGS[practiceCurrentLang] || LANGS.en;
    const answerLang = practiceDirection === 'hu' ? langInfo.tts : 'hu-HU';
    speak(practiceCurrentCorrect, answerLang);
  });

  practiceBtn.addEventListener('click', openPractice);
  practiceCloseBtn.addEventListener('click', closePracticeOverlay);

  practiceDirectionBtn.addEventListener('click', () => {
    practiceDirection = practiceDirection === 'hu' ? 'fx' : 'hu';
    updatePracticeDirectionLabel();
    renderPracticeWord();
  });

  [practiceCheckBtn, practiceNextWordBtn, practiceNextGroupBtn, practiceMicBtn,
   practicePrompt, practiceDirectionBtn].forEach(el => {
    el.addEventListener('mousedown', (e) => e.preventDefault());
    el.addEventListener('touchstart', (e) => {
      if(e.cancelable) e.preventDefault();
    }, { passive: false });
    el.addEventListener('touchend', (e) => {
      if(e.cancelable) e.preventDefault();
      el.click();
    }, { passive: false });
  });

  practiceCheckBtn.addEventListener('click', checkPracticeAnswer);
  practiceInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') checkPracticeAnswer();
  });
  practiceNextWordBtn.addEventListener('click', goToNextPracticeWord);

  practiceNextGroupBtn.addEventListener('click', () => {
    practiceNextGroupBtn.classList.add('flash-white');
    setTimeout(() => practiceNextGroupBtn.classList.remove('flash-white'), 250);
    practiceGroupIndex++;
    practiceWordIndex = 0;
    renderPracticeWord();
  });

  let practiceRecognition = null;
  let practiceRecognitionListening = false;
  if(SR){
    practiceRecognition = new SR();
    practiceRecognition.interimResults = false;
    practiceRecognition.maxAlternatives = 1;
    practiceRecognition.onstart = () => {
      practiceRecognitionListening = true;
      practiceMicBtn.classList.add('listening-active');
    };
    practiceRecognition.onend = () => {
      practiceRecognitionListening = false;
      practiceMicBtn.classList.remove('listening-active');
    };
    practiceRecognition.onerror = (e) => {
      practiceRecognitionListening = false;
      practiceMicBtn.classList.remove('listening-active');
      if(e.error && e.error !== 'aborted' && e.error !== 'no-speech'){
        practiceFeedback.textContent = 'Mikrofonhiba: ' + e.error;
        practiceFeedback.className = 'practice-feedback incorrect';
      }
    };
    practiceRecognition.onresult = (e) => {
      if(!e.results || !e.results[0] || !e.results[0][0]) return;
      practiceInput.value = e.results[0][0].transcript;
      checkPracticeAnswer();
    };
    practiceMicBtn.addEventListener('click', () => {
      if(practiceRecognitionListening){ practiceRecognition.stop(); return; }
      const langInfo = LANGS[practiceCurrentLang] || LANGS.en;
      practiceRecognition.lang = practiceDirection === 'hu' ? langInfo.tts : 'hu-HU';
      practiceFeedback.textContent = '🎤 Hallgatlak… (' + practiceRecognition.lang + ')';
      practiceFeedback.className = 'practice-feedback';
      if(listening) recognition.stop();
      try{
        practiceRecognition.start();
      }catch(e){
        practiceFeedback.textContent = 'Indítási hiba: ' + e.message;
        practiceFeedback.className = 'practice-feedback incorrect';
      }
    });
  } else {
    practiceMicBtn.style.display = 'none';
  }

  // Inicializálás
  profilManager.loadProfiles();
  profilManager.loadDataForActiveProfile();
  renderProfileList();
  updatePlayButtonLabels();
  loadOffsets();
  loadThemeSplotch();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
